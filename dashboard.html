<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citizen Voice - Office Dashboard</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
    color: #222;
}

header {
    background: #123c69;
    color: white;
    padding: 25px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    margin-bottom: 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.stat {
    background: #eef3f8;
    padding: 20px;
    border-radius: 10px;
    text-align: center;
}

.stat h2 {
    margin: 5px 0;
    color: #123c69;
}

.feedback {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 15px;
    margin-top: 15px;
}

.feedback strong {
    color: #123c69;
}

.status {
    display: inline-block;
    margin-top: 10px;
    padding: 6px 10px;
    border-radius: 5px;
    background: #eee;
}

button {
    padding: 10px 15px;
    background: #123c69;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>

<body>

<header>
    <h1>Citizen Voice</h1>
    <p>Office Dashboard</p>
</header>

<div class="container">

    <div class="card">
        <h2>Dashboard Overview</h2>

        <div class="stats">
            <div class="stat">
                <p>Total Feedback</p>
                <h2 id="totalFeedback">0</h2>
            </div>

            <div class="stat">
                <p>Pending</p>
                <h2 id="pendingFeedback">0</h2>
            </div>

            <div class="stat">
                <p>Resolved</p>
                <h2 id="resolvedFeedback">0</h2>
            </div>
        </div>
    </div>

    <div class="card">
        <h2>Citizen Feedback</h2>

        <div id="feedbackList">
            <p>No feedback loaded yet.</p>
        </div>
    </div>

</div>

<footer style="text-align:center; padding:20px; color:#666;">
    © 2026 Citizen Voice
</footer>

</body>
  </html>
