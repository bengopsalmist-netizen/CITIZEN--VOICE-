here<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Citizen Voice - Firestore Test</title>
</head>

<body style="font-family: Arial; padding: 20px;">

  <h2>Citizen Voice</h2>
  <h3>Firestore Direct Test</h3>

  <p>Email: <b>bengopsalmist@gmail.com</b></p>

  <button id="testBtn" style="padding:12px 20px;">
    TEST FIRESTORE
  </button>

  <div id="result" style="margin-top:20px; white-space:pre-wrap;"></div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBBNkfxFr3lovnanrZOzOldIs4lAglyjis",
      authDomain: "citizen-voice-f4b90.firebaseapp.com",
      projectId: "citizen-voice-f4b90",
      storageBucket: "citizen-voice-f4b90.firebasestorage.app",
      messagingSenderId: "784289518285",
      appId: "1:784289518285:web:5d089c6bdf23a43b5fcf84",
      measurementId: "G-C4L9Y55JGG"
    };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);


    const result = document.getElementById("result");
    const button = document.getElementById("testBtn");


    button.addEventListener("click", async () => {

      result.innerText = "Connecting to Firebase...\n";

      try {

        const email = "bengopsalmist@gmail.com";

        const password = prompt("Enter your Firebase login password:");

        if (!password) {
          result.innerText = "Password was not entered.";
          return;
        }


        result.innerText += "Signing in...\n";


        const login = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


        const user = login.user;

        result.innerText +=
          "LOGIN SUCCESSFUL ✅\n\n" +
          "Email: " + user.email + "\n" +
          "UID: " + user.uid + "\n\n";


        result.innerText +=
          "Reading Users/" + user.uid + " ...\n";


        const userRef = doc(
          db,
          "Users",
          user.uid
        );


        const userSnap = await getDoc(userRef);


        if (userSnap.exists()) {

          const data = userSnap.data();

          result.innerText +=
            "\nDOCUMENT FOUND ✅\n\n" +
            JSON.stringify(data, null, 2);

        } else {

          result.innerText +=
            "\nDOCUMENT NOT FOUND ❌\n\n" +
            "Firebase can read Firestore, but it cannot find:\n" +
            "Users/" + user.uid;

        }

      } catch (error) {

        result.innerText =
          "\nTEST FAILED ❌\n\n" +
          "Error: " + error.code + "\n\n" +
          error.message;

      }

    });

  </script>

</body>
</html>
